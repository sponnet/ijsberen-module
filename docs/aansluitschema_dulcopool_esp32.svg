  <rect width="1150" height="740" class="bg" />

  <text x="40" y="42" class="title">Aansluitschema: ProMinent DULCOPOOL Pro - H28 RS-485 - NodeMCU ESP32</text>
  <text x="40" y="64" class="subtitle">3.3V UART naar Modbus RTU (RS-485) bedrading voor ESPHome temperatuur-uitlezing</text>

  <rect x="40" y="100" width="270" height="400" class="box-esp" />
  <text x="175" y="132" text-anchor="middle" class="box-title">NodeMCU ESP32 Wroom</text>
  <text x="175" y="150" text-anchor="middle" class="box-sub">Art. N53 | 3.3V Logic | ESPHome</text>

  <rect x="135" y="90" width="80" height="18" fill="#94a3b8" stroke="#475569" stroke-width="1.5" rx="3" />
  <text x="175" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">USB-C (flashen)</text>

  <rect x="200" y="185" width="95" height="30" class="pin-bg" />
  <text x="247" y="204" text-anchor="middle" class="pin-text">3V3</text>

  <rect x="200" y="235" width="95" height="30" class="pin-bg" />
  <text x="247" y="254" text-anchor="middle" class="pin-text">GND</text>

  <rect x="200" y="285" width="95" height="30" class="pin-bg" />
  <text x="247" y="304" text-anchor="middle" class="pin-text">GPIO16 (RX2)</text>

