      .pin-text { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .wire-label { font-size: 11px; font-weight: 600; fill: #334155; }
      .note-box { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
